<script>
  (function() {
    const theme = localStorage.getItem('cappan_theme') || (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
    document.documentElement.setAttribute('data-theme', theme);
  })();
</script>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Playfair+Display:ital,wght@0,600;0,700;0,800;1,600&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
<script>
/* Đặt sẵn độ rộng + trạng thái chat TRƯỚC khi trình duyệt vẽ lần đầu → không bị dựt khi đổi trang */
(function(){try{var d=document.documentElement,
w=parseInt(localStorage.getItem('cappan_chat_panel_width'),10);
if(w)d.style.setProperty('--chat-w',Math.max(280,Math.min(600,w))+'px');
d.dataset.chat=localStorage.getItem('cappan_chat_panel_collapsed')==='1'?'collapsed':'open';
d.classList.add('no-anim');}catch(e){}})();
</script>
<link rel="stylesheet" href="theme.css">
<link rel="stylesheet" href="ui-polish.css">
<script>
(function(){try{if(localStorage.getItem('cappan_chat_is_open')==='1')document.documentElement.setAttribute('data-chat-open','1');}catch(e){}})();
</script>
</head>
<body data-page="staff-cashier">

<header class="app-header">
  <a class="logo" href="staff-dashboard.html">
    <span class="brand">CAPP<span>AN</span></span>
    <span class="tagline">Staff Panel</span>
  </a>
  <button class="menu-toggle" aria-label="Mở menu" onclick="toggleMobileMenu()">☰</button>
  <nav class="nav" id="mainNav"></nav>
</header>

<div class="dashboard-layout" id="dashboardLayout">
  <div class="dashboard-main">
    <section class="section">
      <div class="staff-header">
        <div>
          <h1 class="staff-title">🧾 Thu ngân tại quầy</h1>
          <p class="staff-sub">Chọn món → áp mã → thu tiền. Giá luôn tính lại từ thực đơn.</p>
        </div>
      </div>

      <div class="cashier-layout">
        <div class="staff-panel cashier-menu">
          <div class="panel-header">
            <h3>Thực đơn</h3>
            <span class="pos-hint" id="posCount"></span>
          </div>
          <div class="pos-toolbar">
            <input type="search" id="posSearch" placeholder="Tìm món..." autocomplete="off" aria-label="Tìm món" oninput="renderPosMenu()">
            <div class="staff-tabs" id="posCats"></div>
          </div>
          <div id="posMenu" class="pos-menu-grid"></div>
        </div>

        <div class="staff-panel cashier-bill">
          <div class="panel-header">
            <h3>Hoá đơn</h3>
            <button class="btn-mini-reset" type="button" onclick="clearBill()">🗑 Xoá</button>
          </div>

          <div id="posLines" class="pos-bill-lines">
            <p class="empty-note">Chưa chọn món nào.</p>
          </div>

          <div class="pos-summary" id="posSummary"></div>

          <div class="pos-promo">
            <input type="text" id="posPromo" placeholder="Mã giảm giá (VD: CAFE20)" autocomplete="off" aria-label="Mã giảm giá">
            <button class="btn-outline" type="button" onclick="applyPosPromo()">Áp dụng</button>
          </div>
          <div class="pos-msg" id="posMsg" role="status"></div>

          <div class="pos-pay-grid">
            <label>Hình thức phục vụ
              <select id="posService" onchange="onPosServiceChange()">
                <option value="counter_pickup">Counter Pickup — không bàn</option>
                <option value="table_service">Table Service — tại bàn</option>
              </select>
            </label>
            <label id="posTableRow" style="display:none">Bàn
              <select id="posTable" onchange="renderBill()"></select>
            </label>
          </div>

          <div class="pos-pay-grid">
            <label>Hình thức
              <select id="posMethod" onchange="renderBill()">
                <option value="cash">Tiền mặt</option>
                <option value="transfer">Chuyển khoản</option>
                <option value="card">Thẻ</option>
              </select>
            </label>
            <label id="posCashRow">Khách đưa
              <input type="number" id="posCash" min="0" step="1000" placeholder="0" oninput="renderChange()">
            </label>
          </div>
          <div class="pos-change" id="posChange"></div>

          <button class="btn btn-block" type="button" onclick="checkoutPos()">Thu tiền</button>
        </div>
      </div>

      <div class="staff-panel" style="margin-top:22px;">
        <div class="panel-header">
          <h3>Hoá đơn gần đây</h3>
          <span class="pos-hint" id="posToday"></span>
        </div>
        <div id="posRecent"></div>
      </div>
    </section>
  </div>

  <div class="panel-resizer" id="panelResizer"></div>

  <aside class="chat-panel" id="chatPanel">
    <div class="chat-panel-header">
      <span class="chat-panel-title">🤖 Trợ lý CAPPAN</span>
      <div class="chat-panel-actions">
        <button class="chat-panel-btn" id="btnCollapseChat" title="Thu gọn bảng chat">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <polyline points="9 18 15 12 9 6"></polyline>
          </svg>
        </button>
        <button class="chat-panel-btn emoji-btn" onclick="clearAICache()" title="Xóa cache AI">🧹</button>
        <button class="chat-panel-btn" id="btnClearChat" title="Xóa lịch sử">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <polyline points="3 6 5 6 21 6"></polyline>
            <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
          </svg>
        </button>
      </div>
    </div>
    <div class="chat-body" id="chatBody"></div>
    <div class="chat-panel-footer">
      <input type="text" id="chatInput" placeholder="Nhập tin nhắn..." autocomplete="off">
      <button id="btnSendChat" title="Gửi">▶</button>
    </div>
  </aside>

  <button class="chat-float-btn" id="chatFloatBtn" title="Mở trợ lý">
    <span>🤖</span>
  </button>
</div>

<div class="toast" id="toast" role="status" aria-live="polite">✓ Thành công!</div>
