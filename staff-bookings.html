<script>
let bkFilter = 'active';

const BK_STATUS = {
  confirmed: '🟢 Đang hoạt động',
  held: '🟡 Đang giữ',
  seated: '🪑 Đang ngồi',
  completed: '✅ Hoàn tất',
  cancelled: '❌ Đã hủy',
  no_show: '⚠️ Không đến'
};
const BK_TAB_LABELS = {
  active: 'Đang hoạt động', confirmed: 'Sắp tới', held: 'Đang giữ', seated: 'Đang ngồi',
  completed: 'Hoàn tất', no_show: 'Không đến', cancelled: 'Đã hủy', all: 'Tất cả'
};

document.addEventListener('DOMContentLoaded', () => {
  if (!Auth.requireStaff()) return;
  renderStaffNav('bookings');
  renderBookings();
  window.addEventListener('cappan:sync', renderBookings);
  window.addEventListener('storage', renderBookings);
  window.addEventListener('cappan:automation', renderBookings);
  window.addEventListener('focus', renderBookings);
  document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') renderBookings(); });
  setInterval(renderBookings, 4000);
});

function setFilter(f) {
  bkFilter = f;
  document.querySelectorAll('#bkTabs .staff-tab').forEach(t =>
    t.classList.toggle('active', t.dataset.tab === f)
  );
  renderBookings();
}

function getFilteredBookings() {
  let list = API.bookings.getAll();
  if (bkFilter === 'active') {
    list = list.filter(b => b.status === 'confirmed' || b.status === 'held' || b.status === 'seated');
  } else if (bkFilter !== 'all') {
    list = list.filter(b => b.status === bkFilter);
  }
  return list.slice().reverse();
}

function money(n) { return API.utils.formatVND(Number(n) || 0); }
function fmtBookingDate(s) {
  if (!s) return '—';
  const p = String(s).split('-');
  return p.length === 3 ? `${p[2]}/${p[1]}/${p[0]}` : s;
}

function bookingName(b) {
  const u = b.userId ? API.users.getById(b.userId) : null;
  return (u && u.name) || b.customerName || 'Khách';
}
function bookingPhone(b) {
  const u = b.userId ? API.users.getById(b.userId) : null;
  return (u && u.phone) || b.phone || '—';
}

function renderTabCounts() {
  const all = API.bookings.getAll();
  const count = f => f === 'all' ? all.length
    : f === 'active' ? all.filter(b => b.status === 'confirmed' || b.status === 'held' || b.status === 'seated').length
    : all.filter(b => b.status === f).length;
  document.querySelectorAll('#bkTabs .staff-tab').forEach(t => {
    const f = t.dataset.tab;
    const base = BK_TAB_LABELS[f] || t.textContent.replace(/\s*\(\d+\)$/, '');
    const n = count(f);
    t.textContent = n ? base + ' (' + n + ')' : base;
  });
}

function renderBookings() {
  renderTabCounts();
  const el = document.getElementById('bookingsContainer');
  if (!el) return;
  const list = getFilteredBookings();

  if (list.length === 0) {
    el.innerHTML = '<p class="empty-note">Không có booking nào.</p>';
    return;
  }

  el.innerHTML = `
    <div class="table-scroll">
    <table class="staff-table booking-table">
      <thead>
        <tr>
          <th>Mã</th><th>Khách</th><th>Chỗ</th>
          <th>Ngày · Giờ</th><th>Số khách</th><th>Cọc</th>
          <th>Trạng thái</th><th>Thao tác</th>
        </tr>
      </thead>
      <tbody>
        ${list.map(b => {
          const user = b.userId ? API.users.getById(b.userId) : null;
          const floor = API.floors.getById(b.floorId);
          const noShow = Number(user && user.noShowCount) || 0;
          const name = bookingName(b);
          const phone = bookingPhone(b);
          const active = b.status === 'confirmed' || b.status === 'held' || b.status === 'seated';
          const deposit = Number(b.deposit) || 0;
          const depCell = deposit > 0
            ? `<div class="deposit-cell ${b.depositPaid ? 'paid' : 'unpaid'}">
                 <strong>${money(deposit)}</strong>
                 <button type="button" class="btn-deposit ${b.depositPaid ? 'paid' : 'unpaid'}"
                         onclick="toggleDeposit('${b.id}')"
                         title="${b.depositPaid ? 'Bỏ đánh dấu đã thu cọc' : 'Đánh dấu đã thu cọc'}">
                   ${b.depositPaid ? '✓ Đã thu' : 'Thu cọc'}
                 </button>
               </div>`
            : '<span class="text-muted">—</span>';
          return `
            <tr>
              <td><strong>${b.id}</strong></td>
              <td>
                ${esc(name)}
                ${b.walkIn ? '<span class="ui-chip" title="Khách vãng lai">Vãng lai</span>' : ''}
                ${b.status === 'held' ? '<span class="ui-chip ui-chip-held" title="Bàn đang được giữ">Giữ bàn</span>' : ''}
                ${b.createdBy === 'staff' ? '<span class="ui-chip ui-chip-muted" title="Nhân viên đặt hộ">Staff</span>' : ''}
                ${noShow > 0 ? `<span class="ui-chip ui-chip-warn" title="Số lần khách không đến">No-show: ${noShow}</span>` : ''}
                <div class="cell-sub">📞 ${esc(phone)}</div>
              </td>
              <td><strong>${esc(b.seatId)}</strong><div class="cell-sub">${floor ? esc(floor.name) : ''}</div></td>
              <td>${esc(fmtBookingDate(b.date))}<div class="cell-sub">${esc(b.time || '')}</div></td>
              <td>${b.guests || 1}</td>
              <td>${depCell}</td>
              <td>${b.paymentPending && b.status === 'held'
                ? '<span class="status-tag held">⏳ Chờ thanh toán</span>'
                : `<span class="status-tag ${b.status}">${BK_STATUS[b.status] || b.status}</span>`}</td>
              <td class="actions-cell">
                ${b.status === 'confirmed' ? `
                  <button class="btn-mini" onclick="checkIn('${b.id}')" title="Khách đã đến">🪑</button>
                  <button class="btn-mini btn-hold" onclick="holdBooking('${b.id}')" title="Đánh dấu đang giữ bàn">⏸</button>
                ` : ''}
                ${b.status === 'held' ? `
                  <button class="btn-mini" onclick="checkIn('${b.id}')" title="Khách đã đến">🪑</button>
                  <button class="btn-mini btn-hold" onclick="unholdBooking('${b.id}')" title="Bỏ giữ bàn">▶</button>
                ` : ''}
                ${active ? `<button class="btn-mini" onclick="complete('${b.id}')" title="Hoàn thành">✓</button>` : ''}
                ${b.status === 'confirmed' ? `<button class="btn-mini-delete" onclick="noShow('${b.id}')" title="Khách không đến">⏱</button>` : ''}
                ${active ? `<button class="btn-mini-delete" onclick="cancel('${b.id}')" title="Hủy">✗</button>` : ''}
              </td>
            </tr>
          `;
        }).join('')}
      </tbody>
    </table>
    </div>
  `;
}

function checkIn(id) {
  const r = API.bookings.checkIn(id);
  if (!r) { showToast('⚠ Không check-in được — booking có thể đã xử lý', '#c62828'); return; }
  renderBookings();
  showToast('🪑 Đã ghi nhận khách đến');
}

function holdBooking(id) {
  const r = API.bookings.setHeld(id, true);
  if (!r) { showToast('⚠ Không giữ bàn được', '#c62828'); return; }
  renderBookings();
  showToast('⏸ Đã đánh dấu bàn đang được giữ');
}

function unholdBooking(id) {
  const r = API.bookings.setHeld(id, false);
  if (!r) { showToast('⚠ Không bỏ giữ được', '#c62828'); return; }
  renderBookings();
  showToast('▶ Đã bỏ giữ bàn');
}

function toggleDeposit(id) {
  const b = API.bookings.getById ? API.bookings.getById(id) : API.bookings.getAll().find(x => x.id === id);
  if (!b) return;
  const r = API.bookings.setDepositPaid(id, !b.depositPaid);
  if (!r) { showToast('⚠ Không cập nhật được cọc', '#c62828'); return; }
  renderBookings();
  showToast(r.depositPaid ? '✓ Đã thu cọc ' + money(r.deposit) : '↩ Đã bỏ đánh dấu thu cọc');
}

/* ---------- NHÂN VIÊN ĐẶT BÀN ---------- */
function defaultBookingDate() {
  const d = new Date(); d.setDate(d.getDate() + 1);
  const p = n => String(n).padStart(2, '0');
  return d.getFullYear() + '-' + p(d.getMonth() + 1) + '-' + p(d.getDate());
}

function openStaffBooking() {
  const modal = document.getElementById('staffBookingModal');
  if (!modal) return;
  const floors = API.floors.getAll();
  const floorSel = document.getElementById('sbFloor');
  floorSel.innerHTML = floors.map(f => `<option value="${f.id}">${esc(f.name)}</option>`).join('');
  const dateEl = document.getElementById('sbDate');
  if (!dateEl.value) dateEl.value = defaultBookingDate();
  document.getElementById('sbPhone').value = '';
  document.getElementById('sbName').value = '';
  document.getElementById('sbGuests').value = 2;
  document.getElementById('sbNote').value = '';
  document.getElementById('sbDepositPaid').checked = false;
  document.getElementById('sbTime').value = '19:00';
  renderStaffBookingSeats();
  openModal('staffBookingModal');
}

function renderStaffBookingSeats() {
  const floorSel = document.getElementById('sbFloor');
  const guests = parseInt(document.getElementById('sbGuests').value, 10) || 1;
  const sel = document.getElementById('sbSeat');
  const seats = API.seats.getAvailable().filter(s => (Number(s.capacity) || 0) >= guests);
  let byFloor = seats.filter(s => s.floorId === floorSel.value);
  if (!byFloor.length && seats.length) {
    /* Tầng đang chọn hết bàn phù hợp → nhảy sang tầng đầu tiên còn bàn. */
    const first = API.floors.getAll().find(f => seats.some(s => s.floorId === f.id));
    if (first) {
      floorSel.value = first.id;
      byFloor = seats.filter(s => s.floorId === first.id);
    }
  }
  const list = byFloor.length ? byFloor : [];
  sel.innerHTML = list.length
    ? list.map(s => `<option value="${s.id}">${s.id} — ${s.capacity} chỗ</option>`).join('')
    : '<option value="">— Hết bàn phù hợp —</option>';
  updateDepositPreview();
}

function updateDepositPreview() {
  const seatId = document.getElementById('sbSeat').value;
  const seat = seatId ? API.seats.getById(seatId) : null;
  const dep = seat && typeof BookingRules !== 'undefined' ? BookingRules.depositFor(seat) : 0;
  document.getElementById('sbDeposit').value = dep ? money(dep) : '—';
}

function lookupBookingCustomer() {
  const phone = String(document.getElementById('sbPhone').value || '').trim();
  if (!phone) return;
  const u = API.users.getByPhone(phone);
  if (u) {
    const nameEl = document.getElementById('sbName');
    if (nameEl && !nameEl.value) nameEl.value = u.name || '';
  }
}

function submitStaffBooking(e) {
  e.preventDefault();
  const seatId = document.getElementById('sbSeat').value;
  if (!seatId) { showToast('⚠ Không còn bàn phù hợp', '#c62828'); return false; }
  const bk = API.bookings.createByStaff({
    seatId,
    date: document.getElementById('sbDate').value,
    time: document.getElementById('sbTime').value,
    guests: parseInt(document.getElementById('sbGuests').value, 10) || 1,
    customerName: document.getElementById('sbName').value,
    phone: document.getElementById('sbPhone').value,
    note: document.getElementById('sbNote').value,
    depositPaid: document.getElementById('sbDepositPaid').checked
  });
  if (!bk) { showToast('⚠ ' + (API._lastError || 'Không đặt được bàn'), '#c62828'); return false; }
  closeModal('staffBookingModal');
  setFilter('active');
  showToast(`✓ Đã đặt bàn ${bk.seatId} cho ${bookingName(bk)} (${bk.guests} khách)`);
  return false;
}

/* ---------- KHÁCH VÃNG LAI ---------- */
function openWalkIn() {
  const sel = document.getElementById('wiSeat');
  const seats = API.seats.getAvailable();
  if (!seats.length) { showToast('⚠ Hết bàn trống — không xếp được khách vãng lai', '#c62828'); return; }
  sel.innerHTML = API.floors.getAll().map(f => {
    const list = seats.filter(s => s.floorId === f.id);
    if (!list.length) return '';
    return `<optgroup label="${esc(f.name)}">${list.map(s =>
      `<option value="${s.id}">${s.id} — ${s.capacity} chỗ</option>`).join('')}</optgroup>`;
  }).join('');
  document.getElementById('wiGuests').value = 2;
  openModal('walkInModal');
}

function submitWalkIn(e) {
  e.preventDefault();
  const bk = API.bookings.createWalkIn({
    seatId: document.getElementById('wiSeat').value,
    guests: parseInt(document.getElementById('wiGuests').value, 10) || 1,
    customerName: document.getElementById('wiName').value,
    phone: document.getElementById('wiPhone').value,
    note: document.getElementById('wiNote').value
  });
  if (!bk) { showToast('⚠ ' + (API._lastError || 'Không xếp được bàn'), '#c62828'); return false; }
  closeModal('walkInModal');
  document.getElementById('walkInForm').reset();
  setFilter('seated');
  showToast(`✓ Đã xếp bàn ${bk.seatId} cho ${bk.guests} khách`);
  return false;
}

function complete(id) {
  if (!confirm(`Hoàn thành booking ${id}?`)) return;
  API.bookings.complete(id);
  renderBookings();
  showToast('✓ Đã hoàn thành');
}

function cancel(id) {
  if (!confirm(`Hủy booking ${id}?`)) return;
  API.bookings.cancel(id);
  renderBookings();
  showToast('✓ Đã hủy booking');
}

function noShow(id) {
  if (!confirm(`Đánh dấu khách không đến cho booking ${id}?\nBàn sẽ được nhả và số lần no-show của khách tăng thêm 1.`)) return;
  const r = API.bookings.markNoShow(id);
  if (!r) { showToast('⚠ Không đánh dấu được — booking có thể đã xử lý', '#c62828'); return; }
  renderBookings();
  showToast('⚠ Đã ghi nhận khách không đến');
}

function completeAll() {
  const active = API.bookings.getAll().filter(b => b.status === 'confirmed' || b.status === 'held' || b.status === 'seated');
  if (active.length === 0) { showToast('Không có booking nào!', '#856404'); return; }
  if (!confirm(`Hoàn thành ${active.length} booking?`)) return;
  active.forEach(b => API.bookings.complete(b.id));
  renderBookings();
  showToast(`✓ Đã hoàn thành ${active.length} booking`);
}
</script>
